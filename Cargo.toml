[package]
name = "argyle-nimble"
version = "0.1.0-dev.0"
edition = "2021"
description = "ESP-IDF NimBLE framework with private build-context and binding-generation tooling"
license = "MIT"
repository = "https://github.com/ArgyleConcepts/ESP32-Nimble-Rust"
readme = "README.md"
keywords = ["ble", "bluetooth", "esp32", "esp-idf", "nimble"]
categories = ["embedded", "hardware-support"]
# Publication requires a separate maintainer decision after package verification.
publish = false
include = [
    "/Cargo.toml",
    "/build.rs",
    "/build_support/**",
    "/cmake/**",
    "/src/**",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/CODE_OF_CONDUCT.md",
    "/docs/**",
    # Exclude Python import caches even though /cmake/** is explicitly included.
    "!**/__pycache__/**",
    "!**/*.py[co]",
]

[build-dependencies]
bindgen = { version = "=0.72.1", default-features = false, features = ["runtime"] }
clang-sys = { version = "=1.8.1", default-features = false, features = ["runtime"] }
serde_json = "1.0"
syn = { version = "=2.0.119", features = ["full"] }
sha2 = "=0.10.9"

[dev-dependencies]
bindgen = { version = "=0.72.1", default-features = false, features = ["runtime"] }
clang-sys = { version = "=1.8.1", default-features = false, features = ["runtime"] }
serde_json = "1.0"
syn = { version = "=2.0.119", features = ["full"] }
sha2 = "=0.10.9"
trybuild = "=1.0.121"
